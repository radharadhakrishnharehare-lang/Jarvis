<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #00d4ff;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 2em;
    color: #00d4ff;
    text-shadow: 0 0 20px #00d4ff;
    margin-bottom: 10px;
    letter-spacing: 8px;
  }
  #status {
    text-align: center;
    color: #0088aa;
    margin-bottom: 10px;
    font-size: 0.85em;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    border: 1px solid #00d4ff33;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    background: #001a22;
  }
  .msg {
    margin-bottom: 15px;
    line-height: 1.5;
  }
  .user { color: #ffffff; }
  .user::before { content: "YOU: "; color: #00d4ff; font-weight: bold; }
  .jarvis { color: #00d4ff; }
  .jarvis::before { content: "JARVIS: "; color: #00ffaa; font-weight: bold; }
  #controls {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  #apikey {
    flex: 1;
    background: #001a22;
    border: 1px solid #00d4ff55;
    color: #00d4ff;
    padding: 10px;
    border-radius: 8px;
    font-family: monospace;
    font-size: 0.8em;
  }
  #micBtn {
    width: 100%;
    padding: 18px;
    background: transparent;
    border: 2px solid #00d4ff;
    color: #00d4ff;
    font-size: 1.2em;
    border-radius: 50px;
    cursor: pointer;
    text-shadow: 0 0 10px #00d4ff;
    box-shadow: 0 0 15px #00d4ff33;
    letter-spacing: 3px;
  }
  #micBtn.listening {
    border-color: #ff4444;
    color: #ff4444;
    text-shadow: 0 0 10px #ff4444;
    box-shadow: 0 0 20px #ff444455;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>
<h1>J.A.R.V.I.S</h1>
<div id="status">Enter your API key and tap the button</div>
<div id="chat"></div>
<div id="controls">
  <input id="apikey" type="password" placeholder="Paste your Gemini API key here" />
</div>
<button id="micBtn" onclick="toggleListen()">🎤 TAP TO SPEAK</button>

<script>
  let recognition;
  let listening = false;
  let conversationHistory = [];

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = (e) => {
      const text = e.results[0][0].transcript;
      handleUserInput(text);
    };
    recognition.onend = () => setListening(false);
    recognition.onerror = () => setListening(false);
  }

  function setListening(val) {
    listening = val;
    const btn = document.getElementById('micBtn');
    const status = document.getElementById('status');
    if (val) {
      btn.textContent = '🔴 LISTENING...';
      btn.classList.add('listening');
      status.textContent = 'Listening...';
    } else {
      btn.textContent = '🎤 TAP TO SPEAK';
      btn.classList.remove('listening');
      status.textContent = 'Ready';
    }
  }

  function toggleListen() {
    if (!recognition) {
      alert('Sorry, your browser does not support voice recognition. Try Chrome.');
      return;
    }
    if (listening) {
      recognition.stop();
    } else {
      recognition.start();
      setListening(true);
    }
  }

  function addMessage(role, text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function speak(text) {
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1;
    utter.pitch = 0.8;
    utter.volume = 1;
    window.speechSynthesis.speak(utter);
  }

  async function handleUserInput(text) {
    const apiKey = document.getElementById('apikey').value.trim();
    if (!apiKey) {
      alert('Please paste your Gemini API key first!');
      return;
    }
    addMessage('user', text);
    document.getElementById('status').textContent = 'Thinking...';
    conversationHistory.push({ role: 'user', parts: [{ text }] });

    try {
      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: "You are Jarvis, a highly intelligent, witty and loyal AI assistant just like in Iron Man. Keep responses concise and conversational. Address the user as 'sir'." }]
            },
            contents: conversationHistory
          })
        }
      );
      const data = await response.json();
      const reply = data.candidates[0].content.parts[0].text;
      conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
      addMessage('jarvis', reply);
      speak(reply);
      document.getElementById('status').textContent = 'Ready';
    } catch (err) {
      addMessage('jarvis', 'Sorry sir, I encountered an error. Please check your API key.');
      document.getElementById('status').textContent = 'Error';
    }
  }
</script>
</body>
</html>
